name: Build TriOS MAX ISO
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['shell/**', 'system/**', 'build/**', '.github/workflows/**']

permissions:
  contents: write

# a newer push cancels any older MAX build that is still running
# (this is a separate group from the regular and Lite builds, so none of
# the three ever cancel each other)
concurrency:
  group: build-iso-max
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin grub-common mtools rsync

      - name: Build TriOS MAX ISO
        run: sudo BUILD_ID="max-$(date +%Y%m%d-%H%M)-${GITHUB_SHA::7}" OUT=$PWD/out ./build/build-iso-max.sh

      - name: Make the update files (shell-update.zip + .triupdate)
        run: |
          mkdir -p out
          ( cd shell && zip -qr ../out/shell-update.zip . -x 'node_modules/*' 'test*' )
          # .triupdate = shell-update.zip's contents PLUS a system/ folder (same
          # layout as this repo's system/), so a future .triupdate can also patch
          # things like the trifs script, not just the Electron shell.
          REPO="$PWD"
          rm -rf /tmp/triupdate && mkdir -p /tmp/triupdate
          ( cd "$REPO/shell" && zip -qr /tmp/triupdate/base.zip . -x 'node_modules/*' 'test*' )
          ( cd /tmp/triupdate && unzip -q base.zip -d . && rm base.zip )
          cp -a "$REPO/system" /tmp/triupdate/system
          ( cd /tmp/triupdate && zip -qr "$REPO/out/TriOS-MAX.triupdate" . )
          ls -la out/shell-update.zip out/TriOS-MAX.triupdate

      - name: Boot test in QEMU (best effort — real use is in VirtualBox)
        continue-on-error: true
        run: |
          sudo apt-get install -y qemu-system-x86 ovmf
          ISO=out/TriOS-MAX.iso
          if [ ! -f "$ISO" ]; then cat out/TriOS-MAX.iso.part* > /tmp/joined.iso; ISO=/tmp/joined.iso; fi
          qemu-img create -f qcow2 /tmp/trios-max-disk.qcow2 4G
          timeout 900 qemu-system-x86_64 -m 3072 -smp 2 -cdrom "$ISO" -hda /tmp/trios-max-disk.qcow2 -boot d \
            -display none -serial file:out/serial.log -monitor none \
            || true
          grep -a "TRIMANGEES_SHELL_READY" out/serial.log && echo BOOT_OK || echo "no ready marker (TCG is slow; check serial.log)"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="max-build-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" --title "TriOS MAX $TAG" --notes "Download the ISO file(s) below. Boot it in VirtualBox. Each account (Adithya/Tarun/Arjun) picks its own drive on first login — a real exFAT partition you can also read directly on Windows/Mac. Drag a future .triupdate file onto the desktop to update everything in one shot without touching anyone's files." \
            out/TriOS-MAX.iso* out/shell-update.zip out/TriOS-MAX.triupdate out/serial.log 2>/dev/null || \
          gh release create "$TAG" --title "TriOS MAX $TAG" --notes "Download the ISO file(s) below." out/TriOS-MAX.iso* out/shell-update.zip out/TriOS-MAX.triupdate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: max-logs
          path: out/*.log
          if-no-files-found: ignore
