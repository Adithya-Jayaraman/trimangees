set default=0
set timeout=3
set gfxpayload=keep

menuentry "TrimangeesOS" {
    linux /live/vmlinuz boot=live components quiet loglevel=3 console=ttyS0,115200 console=tty1 ${TRI_EXTRA}
    initrd /live/initrd.img
}
menuentry "TrimangeesOS (safe graphics)" {
    linux /live/vmlinuz boot=live components nomodeset loglevel=3 console=ttyS0,115200 console=tty1
    initrd /live/initrd.img
}
menuentry "TrimangeesOS (load everything into RAM, then you can remove the drive)" {
    linux /live/vmlinuz boot=live components toram quiet loglevel=3 console=tty1
    initrd /live/initrd.img
}
menuentry "TrimangeesOS (show boot messages)" {
    linux /live/vmlinuz boot=live components loglevel=7 console=tty1
    initrd /live/initrd.img
}
