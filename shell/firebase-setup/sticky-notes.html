<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sticky Notes</title>
<!--
  A tiny self-contained TrimangeesOS cloud app — proof that the pipeline works.
  Upload me to your Storage bucket at  apps/sticky-notes.html  (or host me
  anywhere and register a `url`), then Settings -> Apps -> Reload from cloud.
  Notes are saved locally in this app's own storage.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", Inter, system-ui, sans-serif; }
  body {
    height: 100vh; color: #e8eaf8; overflow: hidden;
    background: radial-gradient(1200px 600px at 20% -10%, #26305a 0%, #10121f 55%, #0a0a14 100%);
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 18px; display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid rgba(120,126,180,.25);
  }
  header .bolt { font-size: 20px; }
  header h1 { font-size: 15px; font-weight: 600; }
  header .sub { font-size: 11px; color: #9aa0c4; margin-left: auto; }
  .bar { padding: 12px 18px; display: flex; gap: 10px; }
  .bar input {
    flex: 1; padding: 10px 13px; border-radius: 9px; font-size: 13px; color: #e8eaf8;
    background: #05060c; border: 1px solid #2b2d47;
  }
  .bar input:focus { outline: none; border-color: #f0c020; }
  .bar button {
    padding: 10px 18px; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 600;
    color: #1a1400; border: none; background: linear-gradient(160deg, #ffe066, #f0b020);
  }
  .bar button:hover { filter: brightness(1.08); }
  .grid {
    flex: 1; overflow-y: auto; padding: 6px 18px 20px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; align-content: start;
  }
  .note {
    background: linear-gradient(160deg, rgba(255,224,102,.14), rgba(255,224,102,.06));
    border: 1px solid rgba(255,224,102,.28); border-radius: 12px; padding: 13px 14px;
    min-height: 96px; position: relative; word-break: break-word; white-space: pre-wrap; font-size: 13px; line-height: 1.5;
  }
  .note .del {
    position: absolute; top: 6px; right: 8px; cursor: pointer; color: #9aa0c4;
    font-size: 15px; line-height: 1; opacity: 0; transition: opacity .12s;
  }
  .note:hover .del { opacity: 1; }
  .note .del:hover { color: #ff8a8a; }
  .note .time { display: block; margin-top: 8px; font-size: 10px; color: #6a6f96; }
  .empty { grid-column: 1/-1; text-align: center; color: #6a6f96; font-size: 13px; padding: 40px 0; }
</style>
</head>
<body>
  <header>
    <span class="bolt">&#9889;</span>
    <h1>Sticky Notes</h1>
    <span class="sub">a TrimangeesOS cloud app</span>
  </header>
  <div class="bar">
    <input id="inp" placeholder="Write a note and press Enter…" autocomplete="off">
    <button id="add">Add</button>
  </div>
  <div class="grid" id="grid"></div>

<script>
  const KEY = "trimangees-sticky-notes";
  const grid = document.getElementById("grid");
  const inp = document.getElementById("inp");
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
  const save = (n) => localStorage.setItem(KEY, JSON.stringify(n));
  let notes = load();

  function render() {
    grid.innerHTML = "";
    if (!notes.length) { grid.innerHTML = '<div class="empty">No notes yet — add your first one above.</div>'; return; }
    notes.forEach((note, i) => {
      const el = document.createElement("div");
      el.className = "note";
      el.innerHTML = '<span class="del" title="Delete">&times;</span><span class="txt"></span><span class="time"></span>';
      el.querySelector(".txt").textContent = note.text;
      el.querySelector(".time").textContent = new Date(note.at).toLocaleString();
      el.querySelector(".del").onclick = () => { notes.splice(i, 1); save(notes); render(); };
      grid.appendChild(el);
    });
  }
  function add() {
    const text = inp.value.trim();
    if (!text) return;
    notes.unshift({ text, at: Date.now() });
    save(notes); inp.value = ""; render();
  }
  document.getElementById("add").onclick = add;
  inp.addEventListener("keydown", e => { if (e.key === "Enter") add(); });
  render(); inp.focus();
</script>
</body>
</html>
