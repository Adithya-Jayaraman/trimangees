<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ChatTrimangees Advanced</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#0e1015; --surface:#161922; --surface2:#1e222d; --border:#272b38;
    --text:#e9ebf1; --dim:#868ca0; --dimmer:#565c6f;
    --accent:#5ee6c7; --accent-soft:rgba(94,230,199,.14);
    --mine:#2a3a4a; --other:#1e222d; --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);
    height:100vh;overflow:hidden;font-size:14px}
  button,input,textarea{font-family:inherit;font-size:13px}

  #loginScreen{height:100vh;display:flex;align-items:center;justify-content:center}
  #loginBox{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px 44px;text-align:center}
  .brand{font-size:19px;font-weight:600}.brand span{color:var(--accent)}
  #loginBox .sub{color:var(--dimmer);font-size:13px;margin:6px 0 22px}
  .accountRow{display:flex;gap:12px}
  .accountBtn{background:var(--surface2);border:1px solid var(--border);color:var(--text);
    padding:14px 22px;border-radius:10px;cursor:pointer;font-size:14px;min-width:90px}
  .accountBtn:hover{border-color:var(--accent);color:var(--accent)}

  #app{display:none;height:100vh;grid-template-columns:220px 1fr;grid-template-rows:100vh}
  #app.on{display:grid}
  #sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 0}
  #sidebar .me{padding:0 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);margin-bottom:8px}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
  .roomLabel{padding:8px 16px;color:var(--dimmer);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .room{padding:9px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;justify-content:space-between}
  .room:hover{background:var(--surface2)}
  .room.active{background:var(--accent-soft);color:var(--accent)}
  .presenceDot{width:7px;height:7px;border-radius:50%;background:var(--dimmer);flex:none}
  .presenceDot.on{background:#5ee6c7;box-shadow:0 0 6px #5ee6c7}
  #switchAcct{margin:auto 16px 0;background:none;border:1px solid var(--border);color:var(--dim);
    padding:7px 10px;border-radius:8px;cursor:pointer}

  #chatArea{display:flex;flex-direction:column;min-width:0}
  #chatHeader{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  #chatHeader b{font-size:15px}
  #msgs{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:3px}
  .msgRow{display:flex;gap:10px;max-width:72%;align-items:flex-end}
  .msgRow.mine{align-self:flex-end;flex-direction:row-reverse}
  .bubble{background:var(--other);border-radius:14px;padding:9px 13px;line-height:1.45;word-break:break-word}
  .msgRow.mine .bubble{background:var(--mine)}
  .bubbleWho{font-size:11px;color:var(--accent);margin-bottom:2px;font-weight:600}
  .bubbleTime{font-size:10px;color:var(--dimmer);margin-top:4px}
  .mention{background:rgba(240,198,116,.22);color:#f0c674;padding:0 3px;border-radius:4px}
  .fileChip{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);
    border-radius:8px;padding:8px 10px;margin-top:6px;cursor:pointer}
  .fileChip:hover{border-color:var(--accent)}
  .readRow{font-size:10px;color:var(--dimmer);margin-top:2px;text-align:right}
  #typing{min-height:18px;padding:0 20px;font-size:11px;color:var(--dimmer)}
  #composer{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--border);align-items:flex-end}
  #msgInput{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:10px;
    padding:10px 14px;color:var(--text);resize:none;max-height:120px;outline:none}
  #msgInput:focus{border-color:var(--accent)}
  .iconBtn{background:var(--surface2);border:1px solid var(--border);color:var(--dim);
    width:38px;height:38px;border-radius:10px;cursor:pointer;flex:none;font-size:16px}
  .iconBtn:hover{border-color:var(--accent);color:var(--accent)}
  #sendBtn{background:var(--accent);border:none;color:#0e1015;font-weight:700;width:38px;height:38px;border-radius:10px;cursor:pointer}
  #empty{margin:auto;color:var(--dimmer);text-align:center}
  ::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:5px}
</style>
</head>
<body>

<div id="loginScreen">
  <div id="loginBox">
    <div class="brand">Chat<span>Trimangees</span> Advanced</div>
    <div class="sub">Who's chatting?</div>
    <div class="accountRow">
      <button class="accountBtn" data-account="Adithya">Adithya</button>
      <button class="accountBtn" data-account="Tarun">Tarun</button>
      <button class="accountBtn" data-account="Arjun">Arjun</button>
    </div>
  </div>
</div>

<div id="app">
  <div id="sidebar">
    <div class="me"><div class="avatar" id="meAvatar"></div><div><b id="meName"></b></div></div>
    <div class="roomLabel">Rooms</div>
    <div class="room active" data-room="family"><span>&#127968; Family</span></div>
    <div class="roomLabel">Direct</div>
    <div id="dmList"></div>
    <button id="switchAcct">Switch account</button>
  </div>
  <div id="chatArea">
    <div id="chatHeader"><b id="roomTitle">Family</b></div>
    <div id="msgs"><div id="empty">No messages yet — say hi!</div></div>
    <div id="typing"></div>
    <div id="composer">
      <button class="iconBtn" id="fileBtn" title="Send a file">&#128206;</button>
      <input type="file" id="fileInput" hidden>
      <textarea id="msgInput" rows="1" placeholder="Message… (@name to mention)"></textarea>
      <button id="sendBtn">&#10148;</button>
    </div>
  </div>
</div>

<script>
const FIREBASE_HOST = 'trimangeesos-default-rtdb.firebaseio.com';
firebase.initializeApp({ databaseURL: 'https://' + FIREBASE_HOST });
const db = firebase.database();
const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PEOPLE = ['Adithya','Tarun','Arjun'];
const MAX_FILE = 700_000;   // base64'd, kept well under the RTDB message-size ceiling

let me = null, room = 'family', msgsRef = null, typingRef = null, presenceRef = null, typingTimer = null;

function roomPath(r){ return 'chattrimangees/rooms/' + r + '/messages'; }
function dmRoom(a,b){ return 'dm_' + [a,b].sort().join('_'); }

document.querySelectorAll('.accountBtn').forEach(btn => {
  btn.onclick = () => {
    me = btn.dataset.account;
    el('loginScreen').style.display = 'none';
    el('app').classList.add('on');
    el('meAvatar').textContent = me[0];
    el('meName').textContent = me;
    renderDms();
    goRoom('family', 'Family');
    setupPresence();
  };
});
el('switchAcct').onclick = () => {
  if (presenceRef) presenceRef.set(false);
  me = null;
  el('app').classList.remove('on');
  el('loginScreen').style.display = 'flex';
};

function renderDms(){
  const wrap = el('dmList'); wrap.innerHTML = '';
  PEOPLE.filter(p => p !== me).forEach(p => {
    const d = document.createElement('div');
    d.className = 'room'; d.dataset.room = dmRoom(me, p);
    d.innerHTML = `<span>${esc(p)}</span><span class="presenceDot" id="dot-${p}"></span>`;
    d.onclick = () => goRoom(dmRoom(me, p), p);
    wrap.appendChild(d);
    db.ref('chattrimangees/presence/' + p).on('value', s => {
      const on = s.val() === true || (s.val() && s.val().online);
      const dot = el('dot-' + p); if (dot) dot.classList.toggle('on', !!on);
    });
  });
}

function goRoom(r, title){
  room = r;
  el('roomTitle').textContent = title;
  document.querySelectorAll('.room').forEach(x => x.classList.toggle('active', x.dataset.room === r));
  if (msgsRef) msgsRef.off();
  if (typingRef) typingRef.off();
  el('msgs').innerHTML = '';
  msgsRef = db.ref(roomPath(r)).limitToLast(200);
  msgsRef.on('child_added', snap => addMsg(snap.key, snap.val()));
  typingRef = db.ref('chattrimangees/typing/' + r);
  typingRef.on('value', s => {
    const v = s.val() || {};
    const others = Object.keys(v).filter(k => k !== me && v[k]);
    el('typing').textContent = others.length ? others.join(', ') + (others.length > 1 ? ' are' : ' is') + ' typing…' : '';
  });
}

function fmtTime(ts){ return new Date(ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
function linkify(text){
  let h = esc(text);
  h = h.replace(/@(\w+)/g, (m, n) => PEOPLE.some(p => p.toLowerCase() === n.toLowerCase()) ? `<span class="mention">@${n}</span>` : m);
  return h;
}

function addMsg(key, m){
  el('empty').remove && el('empty').style && (el('empty').style.display = 'none');
  const row = document.createElement('div');
  row.className = 'msgRow' + (m.from === me ? ' mine' : '');
  let body = m.text ? `<div>${linkify(m.text)}</div>` : '';
  if (m.file) body += `<div class="fileChip" data-key="${key}">&#128196; <span>${esc(m.file.name)}</span> <span style="color:var(--dimmer)">(${Math.round(m.file.size/1024)} KB)</span></div>`;
  row.innerHTML = `<div class="bubble">${m.from !== me ? `<div class="bubbleWho">${esc(m.from)}</div>` : ''}${body}<div class="bubbleTime">${fmtTime(m.ts)}</div></div>`;
  if (m.file) row.querySelector('.fileChip').onclick = () => downloadFile(m.file);
  el('msgs').appendChild(row);
  el('msgs').scrollTop = el('msgs').scrollHeight;
  // read receipt (best-effort — not shown as a UI yet, just recorded)
  if (m.from !== me) db.ref(roomPath(room) + '/' + key + '/readBy/' + me).set(true);
}

function downloadFile(f){
  const a = document.createElement('a');
  a.href = f.data; a.download = f.name; a.click();
}

el('msgInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  else setTyping(true);
});
el('msgInput').addEventListener('input', () => {
  el('msgInput').style.height = 'auto';
  el('msgInput').style.height = Math.min(120, el('msgInput').scrollHeight) + 'px';
});
function setTyping(on){
  db.ref('chattrimangees/typing/' + room + '/' + me).set(on);
  clearTimeout(typingTimer);
  if (on) typingTimer = setTimeout(() => db.ref('chattrimangees/typing/' + room + '/' + me).set(false), 2500);
}
el('sendBtn').onclick = send;
function send(){
  const text = el('msgInput').value.trim();
  if (!text) return;
  db.ref(roomPath(room)).push({ from: me, text, ts: Date.now() });
  el('msgInput').value = ''; el('msgInput').style.height = 'auto';
  setTyping(false);
}

el('fileBtn').onclick = () => el('fileInput').click();
el('fileInput').onchange = () => {
  const f = el('fileInput').files[0]; if (!f) return;
  if (f.size > MAX_FILE) { alert('That file is too big to share here (keep it under ~700 KB). Use a shared folder in Files for bigger files.'); el('fileInput').value = ''; return; }
  const r = new FileReader();
  r.onload = () => {
    db.ref(roomPath(room)).push({ from: me, ts: Date.now(), file: { name: f.name, size: f.size, data: r.result } });
    el('fileInput').value = '';
  };
  r.readAsDataURL(f);
};

function setupPresence(){
  presenceRef = db.ref('chattrimangees/presence/' + me);
  presenceRef.onDisconnect().set(false);
  presenceRef.set(true);
  setInterval(() => { if (me) presenceRef.set(true); }, 20000);   // heartbeat survives a flaky connection
}
window.addEventListener('beforeunload', () => { if (presenceRef) presenceRef.set(false); });
</script>
</body>
</html>
